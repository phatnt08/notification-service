version: '3.8'

name: kafka-kraft-cluster
services:
  kafka-node-1:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-node-1
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node-1:9093,2@kafka-node-2:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: 5f0330bf-9411-4438-a0fa-b4fd5baf7d28
      CLUSTER_ID: 5f0330bf-9411-4438-a0fa-b4fd5baf7d28
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    ports:
      - "9092:9092"
    volumes:
      - kafka-node-1-data:/var/lib/kafka/data
    networks:
      - my-network

  kafka-node-2:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-node-2
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-node-2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-node-1:9093,2@kafka-node-2:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CLUSTER_ID: 5f0330bf-9411-4438-a0fa-b4fd5baf7d28
      CLUSTER_ID: 5f0330bf-9411-4438-a0fa-b4fd5baf7d28
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    ports:
      - "9093:9092"
    volumes:
      - kafka-node-2-data:/var/lib/kafka/data
    networks:
      - my-network

volumes:
  kafka-node-1-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\kafka-data\node-1
  kafka-node-2-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\kafka-data\node-2

networks:
  my-network:
    external: true